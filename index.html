<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b1424"><title>Wave — Find your frequency</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"></head>
<body><div class="app"><aside class="sidebar"><a class="brand" href="#" aria-label="Wave home"><span class="brandmark">≋</span>wave<span class="brand-dot">●</span></a><nav><button class="nav active" data-page="home"><i data-icon="home"></i>Home</button><button class="nav" data-page="search"><i data-icon="search"></i>Search</button><button class="nav" data-page="import"><i data-icon="upload"></i>Import music</button><button class="nav" data-page="community"><i data-icon="rank"></i>Community</button><button class="nav mobile-only" data-page="profile"><i data-icon="user"></i>Profile</button><button class="nav mobile-library" data-page="library"><i data-icon="library"></i>Library</button></nav><div class="library-heading"><span><i data-icon="library"></i>Your library</span><button class="icon" id="new-playlist" aria-label="Create playlist"><i data-icon="plus"></i></button></div><div class="library-tabs"><button class="chip selected" data-page="library">Playlists</button><button class="chip" id="import-button">Your audio</button></div><button class="library-item" data-page="liked"><span class="liked-art">♥</span><span>Liked songs<small id="liked-count">Your favorites, all together</small></span></button><div id="sidebar-playlists"></div><div class="sidebar-bottom"><button class="support-link" data-page="support"><i data-icon="heart"></i>Support Wave <span>↗</span></button><span class="live-dot"></span> Music, on your wavelength.<button id="about-button">Independent sound. Open by design. ↗</button></div></aside><main><header><div class="header-left"><button class="icon" id="back" aria-label="Go home"><i data-icon="back"></i></button><label class="searchbox"><i data-icon="search"></i><input id="search" placeholder="What do you want to listen to?" autocomplete="off" aria-label="Search music"><span>⌘ K</span></label></div><div class="header-right"><span class="free-badge"><span class="live-dot"></span> All music. Always free.</span><button class="avatar" id="profile" aria-label="About your local profile">W</button></div></header><div class="content" id="content"></div><footer class="content-footer"><span>WAVE ORIGINALS</span><span>No ads. No subscriptions. Just your frequency.</span><span>Made for listening.</span></footer></main></div><div id="queue" class="queue hidden"></div><section class="player" aria-label="Music player"><button class="track-current" id="expand-player"><div id="mini-art" class="mini-art"></div><span><b id="track-title">Afterglow</b><small id="track-artist">Wave Originals</small></span></button><button class="icon" id="like-current" aria-label="Like current song"><i data-icon="heart"></i></button><div class="player-middle"><div class="play-controls"><button class="icon" id="shuffle" aria-label="Shuffle" aria-pressed="false"><i data-icon="shuffle"></i></button><button class="icon" id="previous" aria-label="Previous track"><i data-icon="previous"></i></button><button class="play-button" id="play" aria-label="Play"><i data-icon="play"></i></button><button class="icon" id="next" aria-label="Next track"><i data-icon="next"></i></button><button class="icon" id="repeat" aria-label="Repeat track" aria-pressed="false"><i data-icon="repeat"></i></button></div><div class="progress"><span id="elapsed">0:00</span><input type="range" id="seek" aria-label="Seek" value="0" min="0" max="100" step="0.1"><span id="duration">0:48</span></div></div><div class="player-right"><span class="audio-label" id="audio-status">ORIGINAL AUDIO</span><button class="icon" id="queue-button" aria-label="Toggle queue"><i data-icon="queue"></i></button><button class="icon" id="mute" aria-label="Mute"><i data-icon="volume"></i></button><input type="range" id="volume" aria-label="Volume" min="0" max="1" step="0.01" value="0.65"><button class="icon" id="fullscreen" aria-label="Open immersive player"><i data-icon="expand"></i></button></div></section><div id="immersive" class="immersive hidden"></div><dialog id="modal"><form id="playlist-form"><button type="button" class="modal-close icon" aria-label="Close dialog">✕</button><span class="eyebrow">YOUR NEXT FAVORITE MIX</span><h2>Create a playlist</h2><label>Playlist name<input id="playlist-name" required maxlength="60" placeholder="Give it a good name…"></label><button class="primary" type="submit">Create playlist</button></form><div id="modal-body"></div></dialog><input type="file" accept="audio/*" id="file-input" multiple hidden><div id="toast" role="status"></div><input type="file" id="folder-input" accept="audio/*" webkitdirectory directory multiple hidden><div id="drop-overlay" class="drop-overlay hidden"><div><i data-icon="upload"></i><h2>Make some room for your music.</h2><p>Drop audio files to add them to Wave.</p></div></div><script src="app.js"></script><script src="enhancements.js"></script><script src="pages.js"></script></body></html>
