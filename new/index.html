<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#eaf3fc"><title>Wave</title><link rel="stylesheet" href="./wave.css?v=glass2"><script type="module" src="./wave.js?v=glass2"></script></head>
<body>
<aside><a class="logo" href="#home"><b>≋</b><span>wave</span></a><nav aria-label="Library navigation"><a href="#home">⌂ <span>Home</span></a><a href="#search">⌕ <span>Search</span></a><a href="#library">▤ <span>Library</span></a><a href="#liked">♡ <span>Liked</span></a></nav><button id="import" class="accent">＋ <span>Import</span></button><small>ON THIS DEVICE</small></aside>
<main id="view"></main>
<footer><div class="track"><div class="art">≋</div><div><strong id="playing">Nothing playing</strong><small id="playing-source">Your audio player</small></div></div><div class="transport"><div><button id="prev" aria-label="Previous track">‹</button><button id="play" aria-label="Play">▶</button><button id="next" aria-label="Next track">›</button></div><div class="progress"><small id="elapsed">0:00</small><input id="seek" type="range" aria-label="Seek" min="0" max="1000" value="0"><small id="duration">0:00</small></div></div><input type="range" id="volume" aria-label="Volume" min="0" max="1" step=".05" value=".75"></footer>
<dialog id="imports"><form id="link-form"><div class="heading"><h2>Import music</h2><button type="button" id="close" aria-label="Close">×</button></div><button type="button" id="pick" class="accent">Choose audio files</button><input type="file" id="files" accept="audio/*,.flac,.m4a,.aac" multiple hidden><p>Or save a song or playlist from another service.</p><label>Share link<input type="url" id="url" placeholder="https://…" required maxlength="2000"></label><label>Name <small>Optional</small><input id="name" maxlength="120"></label><button class="accent">Save link</button></form></dialog>
<div id="notice" role="status"></div><audio id="audio" preload="metadata"></audio>
</body></html>
