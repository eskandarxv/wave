<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>Wave</title><link rel="stylesheet" href="./wave.css?v=mobile8"><script type="module" src="./wave.js?v=mobile8"></script></head>
<body>
<aside><a class="logo" href="#home"><b>≋</b><span>wave</span></a><nav aria-label="Library navigation"><a href="#home" aria-label="Home">⌂ <span>Home</span></a><a href="#search" aria-label="Search">⌕ <span>Search</span></a><a href="#library" aria-label="Library">▤ <span>Library</span></a><a href="#playlists" aria-label="Playlists">☷ <span>Playlists</span></a></nav><button id="import" aria-label="Import music" class="accent">＋ <span>Import</span></button><small>LOCAL LIBRARY</small></aside>
<main id="view"></main>
<footer><div class="track"><div class="art">≋</div><div><strong id="playing">Nothing playing</strong><small id="playing-source">Your audio player</small></div></div><div class="transport"><div><button id="prev" aria-label="Previous track">‹</button><button id="play" aria-label="Play">▶</button><button id="next" aria-label="Next track">›</button></div><div class="progress"><small id="elapsed">0:00</small><input id="seek" type="range" aria-label="Seek" min="0" max="1000" value="0"><small id="duration">0:00</small></div></div><input type="range" id="volume" aria-label="Volume" min="0" max="1" step=".05" value=".75"></footer>
<dialog id="imports"><form id="link-form"><div class="heading"><h2>Import music</h2><button type="button" id="close" aria-label="Close">×</button></div><button type="button" id="pick" class="accent">Choose audio files</button><input type="file" id="files" accept="audio/*,.flac,.m4a,.aac" multiple hidden><p>Or save a song or playlist from another service.</p><label>Share link<input type="url" id="url" placeholder="https://…" required maxlength="2000"></label><label>Name <small>Optional</small><input id="name" maxlength="120"></label><button class="accent">Save link</button></form><section class="playlist-import"><h2>Import a playable playlist</h2><p>Choose an M3U file with direct HTTPS audio links. Music-service share links open in the source app.</p><label><input type="checkbox" id="playlist-rights"> I have permission to play these audio files.</label><label>M3U playlist<input type="file" id="playlist-file" accept=".m3u,.m3u8"></label></section><p id="import-status" role="status"></p></dialog>
<div id="notice" role="status"></div><audio id="audio" preload="metadata"></audio>
</body></html>
